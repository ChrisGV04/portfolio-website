name: Deployment

on:
  push:
    # branches: ['main']
    branches: []

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 12
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml' # Needed to use multiple directories
      - name: Setup CMS
        run: |
          touch .env
          echo "${{ secrets.CMS_ENV }}" | base64 --decode > .env
          pnpm install --frozen-lockfile
          pnpm migrate
          pnpm build
        working-directory: ./server
      - name: Setup Client
        run: |
          touch .env
          echo "${{ secrets.CLIENT_ENV }}" | base64 --decode > .env
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm build
        working-directory: ./client
      - name: Restart PM2
        run: |
          touch pm2.config.js
          echo "${{ secrets.PM2_CONFIG }}" | base64 --decode > pm2.config.js
          pm2 restart pm2.config.js
